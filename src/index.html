<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math-Calc</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="card">
  <h1>Vector Magnitude</h1>
  <form id="vector-form">
    <div class="group">
      <label for="x-val">X</label>
      <input type="number" id="x-val" step="any" required placeholder="3">
    </div>
    <div class="group">
      <label for="y-val">Y</label>
      <input type="number" id="y-val" step="any" required placeholder="4">
    </div>
    <button type="submit">calculate magnitude</button>
  </form>
  <p id="output"></p>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
