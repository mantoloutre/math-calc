<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Math-Calc</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="card">
    <h1>Vector Magnitude</h1>
    <form id="vector-form">
        <div class="group">
            <label for="x-val">X</label>
            <input type="number" id="x-val" step="any" required placeholder="number">
        </div>
        <div class="group">
            <label for="y-val">Y</label>
            <input type="number" id="y-val" step="any" required placeholder="number">
        </div>
        <button type="submit">calculate magnitude</button>
    </form>
    <p id="output"></p>
</main>
<script type="module" src="../js/vectorMagnitude.js"></script>
</body>
</html>
